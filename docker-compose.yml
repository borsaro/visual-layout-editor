services:
  roby-visual-layout-editor:
    build:
      context: .
    image: roby-visual-layout-editor:latest
    container_name: roby-visual-layout-editor
    restart: unless-stopped
    ports:
      - "${ROBY_LAYOUT_EDITOR_PORT:-8765}:8765"
    environment:
      ROBY_LAYOUT_EDITOR_HOST: "0.0.0.0"
      ROBY_LAYOUT_EDITOR_PORT: "8765"
      ROBY_LAYOUT_CAMPAIGNS_ROOT: "/campaigns"
      ROBY_LAYOUT_DOCKER: "1"
      ROBY_LAYOUT_FONTS_ROOT: "/host-fonts/system:/host-fonts/library:/host-fonts/user"
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
    shm_size: "512mb"
    volumes:
      - .:/app
      - ${ROBY_LAYOUT_CAMPAIGNS_HOST_PATH:-/Users/admin/Desktop/HermesRack/SOCIAL-MEDIA-MANAGER}:/campaigns
      # Mac Font Book → served to editor + Playwright via /api/fonts
      - /System/Library/Fonts:/host-fonts/system:ro
      - /Library/Fonts:/host-fonts/library:ro
      - ${HOME}/Library/Fonts:/host-fonts/user:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
