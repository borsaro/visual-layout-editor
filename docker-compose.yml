services:
  roby-visual-layout-editor:
    build:
      context: .
    image: roby-visual-layout-editor:latest
    container_name: roby-visual-layout-editor
    restart: unless-stopped
    ports:
      - "${ROBY_LAYOUT_EDITOR_PORT:-8765}:8765"
    environment:
      ROBY_LAYOUT_EDITOR_HOST: "0.0.0.0"
      ROBY_LAYOUT_EDITOR_PORT: "8765"
      ROBY_LAYOUT_CAMPAIGNS_ROOT: "/campaigns"
      ROBY_LAYOUT_DOCKER: "1"
      # Docker File Sharing allows /Users (+ /Volumes) only — skip /System and /Library
      ROBY_LAYOUT_FONTS_ROOT: "/host-fonts/user"
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
    shm_size: "512mb"
    volumes:
      - .:/app
      - ${ROBY_LAYOUT_CAMPAIGNS_HOST_PATH:-/Users/admin/Desktop/HermesRack/SOCIAL-MEDIA-MANAGER}:/campaigns
      - ${HOME}/Library/Fonts:/host-fonts/user:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # MCP over HTTP: gli LLM si collegano a http://<host>:8766/mcp, nessuna installazione locale.
  roby-layout-mcp:
    build:
      context: .
    image: roby-visual-layout-editor:latest
    container_name: roby-layout-mcp
    restart: unless-stopped
    depends_on:
      - roby-visual-layout-editor
    command: ["python", "mcp-server/server.py"]
    ports:
      - "${ROBY_LAYOUT_MCP_PORT:-8766}:8766"
    environment:
      ROBY_MCP_TRANSPORT: "streamable-http"
      ROBY_MCP_HOST: "0.0.0.0"
      ROBY_MCP_PORT: "8766"
      # '*' disabilita la protezione DNS rebinding: serve per raggiungerlo da un host LAN qualsiasi
      ROBY_MCP_ALLOWED_HOSTS: "${ROBY_LAYOUT_MCP_ALLOWED_HOSTS:-*}"
      ROBY_EDITOR_URL: "http://roby-visual-layout-editor:8765"
    volumes:
      - .:/app
